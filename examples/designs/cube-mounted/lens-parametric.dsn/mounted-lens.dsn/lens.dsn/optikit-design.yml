optikit-version: v0.0.0-alpha.1

design:
  description: A parameterized lens mounted on a procedurally-generated insert
  tags:
    - cube-mounted
    - lens
    - lens/convex

components:
  optical:
    kind: primitive
    primitive:
      kind: optiland
      model: ~ optiland-model
    pose:
      rotation:
        kind: grid
      translation:
  mechanical:
    kind: primitive
    primitive:
      kind: computed
      function: compute-geometry.py
      inputs:
        lens: ~ optiland-model
    pose:
      rotation:
        kind: grid

inputs:
  optiland-model:
    kind: string
