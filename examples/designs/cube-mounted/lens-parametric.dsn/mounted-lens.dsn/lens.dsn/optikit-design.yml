optikit-version: v0.0.0-alpha.1

design:
  description: A parameterized lens mounted on a procedurally-generated insert
  tags:
    - cube-mounted
    - lens
    - lens/convex

components:
  optical:
    kind: primitive
    primitive:
      kind: static
      static-model:
        optiland: AC254-100-A-Zemax-ZMX.optiland
        step: AC254-100-A-Step.step
    pose:
      rotation:
        kind: grid
        [...]
      translation:
        [...]
  mechanical-template:
    kind: primitive
    primitive:
      kind: computed
      function: compute-geometry.py
      inputs:
        lens: ~ optiland-model
      result: components.mechanical-realized
  mechanical-realized:
    kind: primitive
    primitive:
      kind: static
      static-model:
        glb: computed-insert.glb
        step: computed-insert.step
    pose:
      rotation:
        kind: grid

inputs:
  optiland-model:
    kind: string

constraints:
  cached-results:
    - result: components.mechanical-realized
      input: components.optical
      computation: components.mechanical-template
