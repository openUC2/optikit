optikit-version: v0.0.0-alpha.1

design:
  description: A microscope slide holder mounted in a cube
  tags:
    - composition/cube-mounted
    - in/core-box

components:
  skeleton:
    kind: design
    design: primitives/cube-skeleton.dsn
    pose:
      rotation:
        kind: grid
  mounted-slide-holder:
    kind: design
    design: mounted-holder.dsn
    pose:
      rotation:
        kind: grid

inputs:
  offset:
    description: Translation of mounted-slide-holder along its normal vector
    kind: float64
    units: mm
    min: -12
    max: 7
    tags:
      - pose/insert/translation
      - adjustment/manual-assembly

variants:
  z:
    description: Normal vector of the sample slide is the z-axis
    components:
      mounted-slide-holder:
        pose:
          translation:
            offset-mm:
              z: 5 + inputs.offset.value
    tags:
      - pose/insert/orientation/vertical
  x:
    description: Normal vector of the sample slide is the x-axis
    components:
      mounted-slide-holder:
        pose:
          rotation:
            grid: {z: +x, x: -z}
          translation:
            offset-mm:
              x: 5 + inputs.offset.value
    tags:
      - pose/insert/orientation/horizontal
