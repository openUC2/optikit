optikit-version: v0.0.0-alpha.1

design:
  description: A magnetic sample holder clip on a cube insert
  tags:
    - insert-mounted
    - sample-holder
    - in/core-box

components:
  clip:
    type: primitive
    primitive:
      static-models:
        gltf: PRT - 2008 - SAMCLP.glb
        step: PRT - 2008 - SAMCLP.stp
    pose:
      rotation:
        type: grid
      translation:
        offset-mm: {z: -10}
  magnet-1:
    type: primitive
    primitive:
      static-models:
        bom: BUY - NeFeB-Magnet - ø8x3 N40 Ni.bom.yml
  magnet-2:
    type: primitive
    primitive:
      static-models:
        bom: BUY - NeFeB-Magnet - ø8x3 N40 Ni.bom.yml
  magnet-3:
    type: primitive
    primitive:
      static-models:
        bom: BUY - NeFeB-Magnet - ø8x3 N40 Ni.bom.yml
  magnet-4:
    type: primitive
    primitive:
      static-models:
        bom: BUY - NeFeB-Magnet - ø8x3 N40 Ni.bom.yml
  insert:
    type: primitive
    primitive:
      static-models:
        gltf: PRT - 2028 - INSSAMMNT - V04.glb
        step: PRT - 2028 - INSSAMMNT - V04.stp
    pose:
      rotation:
        type: grid
