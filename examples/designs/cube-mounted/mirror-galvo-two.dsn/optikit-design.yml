optikit-version: v0.0.0-alpha.1

design:
  description: Two motorized galvo mirrors in a cube
  tags:
    - composition/cube-mounted
    - in/kit/galvo-box

inputs:
  mirror-1-rotation:
    description: Rotation of mirror 1 about the rotation axis of its motor
    kind: float64
    units: deg
    tags:
      - pose/actuator/orientation
      - adjustment/actuated
      - actuation/rotational/stepper
      - control/electronic
  mirror-2-rotation:
    description: Rotation of mirror 2 about the rotation axis of its motor
    kind: float64
    units: deg
    tags:
      - pose/actuator/orientation
      - adjustment/actuated
      - actuation/rotational/stepper
      - control/electronic

components:
  skeleton:
    kind: design
    design: primitives/cube-skeleton.dsn
  mounted-mirrors:
    kind: design
    design: mounted-mirrors.dsn
    instantiation:
      inputs:
        mirror-1-rotation: ~ inputs['mirror-1-rotation'].value
        mirror-2-rotation: ~ inputs['mirror-2-rotation'].value
  skeleton-extra-full:
    kind: design
    design: primitives/cube-skeleton.dsn
  skeleton-extra-partial:
    kind: primitive
    primitive:
      static-models:
        gltf: primitives/cube-skeleton.dsn/PRT - 1003 - CUBHLF111 - V04.glb
        step: primitives/cube-skeleton.dsn/PRT - 1003 - CUBHLF111 - V04.stp
    tags:
      - procurement/injection-mold
      - in/kit/galvo-box

assemblies:
  x:
    description: Rotational axes of motors are in the x-y plane
    children:
      skeleton: {}
      mounted-mirrors: {}
      skeleton-extra-full:
        pose:
          translation:
            offset-grid: {x: -1}
      skeleton-extra-partial:
        pose:
          rotation:
            kind: grid
            grid: {z: -z}
          translation:
            offset-grid: {y: -1}
    tags:
      - pose/insert/orientation/horizontal
  z:
    description: Rotational axis of the non-offset motor is in the z-axis
    children:
      skeleton: {}
      mounted-mirrors:
        pose:
          rotation:
            kind: grid
            grid: {z: -y, x: -z}
      skeleton-extra-full:
        pose:
          translation:
            offset-grid: {z: 1}
      skeleton-extra-partial:
        pose:
          translation:
            offset-grid: {x: -1}
    tags:
      - pose/insert/orientation/vertical
  z-offset:
    description: Rotational axis of the offset motor is in the z-axis
    children:
      skeleton: {}
      mounted-mirrors:
        pose:
          rotation:
            kind: grid
            grid: {z: +y}
      skeleton-extra-full:
        pose:
          translation:
            offset-grid: {x: -1}
      skeleton-extra-partial:
        pose:
          rotation:
            kind: grid
            grid: {z: -z}
          translation:
            offset-grid: {z: 1}
    tags:
      - pose/insert/orientation/vertical
