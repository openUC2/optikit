optikit-version: v0.0.0-alpha.1

design:
  description: Two motorized galvo mirrors in a cube
  tags:
    - composition/cube-mounted
    - in/galvo-box

components:
  skeleton:
    kind: design
    design: primitives/cube-skeleton.dsn
    pose:
      rotation:
        kind: grid
  mounted-mirrors:
    kind: design
    design: mounted-mirrors.dsn
    instantiation:
      inputs:
        mirror-1-rotation: ~ inputs['mirror-1-rotation'].value
        mirror-2-rotation: ~ inputs['mirror-2-rotation'].value
    pose:
      rotation:
        kind: grid
  skeleton-extra-1:
    kind: design
    design: primitives/cube-skeleton.dsn
    pose:
      rotation:
        kind: grid
      translation:
        offset-grid: {x: -1}
  skeleton-extra-2:
    kind: primitive
    primitive:
      static-models:
        gltf: primitives/cube-skeleton.dsn/PRT - 1003 - CUBHLF111 - V04.glb
        step: primitives/cube-skeleton.dsn/PRT - 1003 - CUBHLF111 - V04.stp
    pose:
      rotation:
        kind: grid
        grid: {z: -z}
      translation:
        offset-grid: {y: -1}
    tags:
      - procurement/injection-mold
      - in/kit/galvo-box

inputs:
  mirror-1-rotation:
    description: Rotation of mirror 1 about the rotation axis of its motor
    kind: float64
    units: deg
    tags:
      - pose/actuator/orientation
      - adjustment/actuated
      - actuation/rotational/stepper
      - control/electronic
  mirror-2-rotation:
    description: Rotation of mirror 2 about the rotation axis of its motor
    kind: float64
    units: deg
    tags:
      - pose/actuator/orientation
      - adjustment/actuated
      - actuation/rotational/stepper
      - control/electronic
