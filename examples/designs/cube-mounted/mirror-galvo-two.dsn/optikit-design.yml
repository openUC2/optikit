optikit-version: v0.0.0-alpha.1

design:
  description: Two motorized galvo mirrors in a cube
  tags:
    - cube-mounted
    - mirror
    - mirror/single-sided
    - mirror/flat
    - actuator/stepper-motor
    - control/electronic
    - in/galvo-box

components:
  skeleton:
    type: design
    design: primitives/cube-skeleton.dsn
    pose:
      rotation:
        type: grid
  mounted-mirrors:
    type: design
    design: mounted-mirrors.dsn
    instantiation:
      inputs:
        mirror-1-rotation: ~ inputs['mirror-1-rotation'].value
        mirror-2-rotation: ~ inputs['mirror-2-rotation'].value
    pose:
      rotation:
        type: grid
  skeleton-extra-1:
    type: design
    design: primitives/cube-skeleton.dsn
    pose:
      rotation:
        type: grid
      translation:
        offset-grid: {x: -1}
  skeleton-extra-2:
    type: primitive
    primitive:
      static-models:
        gltf: primitives/cube-skeleton.dsn/PRT - 1003 - CUBHLF111 - V04.glb
        step: primitives/cube-skeleton.dsn/PRT - 1003 - CUBHLF111 - V04.stp
    pose:
      rotation:
        type: grid
        grid: {z: -z}
      translation:
        offset-grid: {y: -1}

inputs:
  mirror-1-rotation:
    description: Rotation of mirror 1 about the rotation axis of its motor
    type: float64
    units: deg
    tags:
      - adjustment/electronic
      - actuation/stepper
  mirror-2-rotation:
    description: Rotation of mirror 2 about the rotation axis of its motor
    type: float64
    units: deg
    tags:
      - adjustment/electronic
      - actuation/stepper
