optikit-version: v0.0.0-alpha.1

design:
  description: Two motorized galvo mirrors on a cube insert
  tags:
    - insert-mounted
    - mirror
    - mirror/single-sided
    - mirror/flat
    - actuator/stepper-motor
    - control/electronic
    - in/galvo-box

components:
  motorized-mirror-1:
    type: design
    design: primitives/motorized-mirror.dsn
    instantiation:
      inputs:
        mirror-rotation: ~ inputs['mirror-1-rotation'].value
    pose:
      rotation:
        type: grid
        grid: {z: -z}
  motorized-mirror-2:
    type: design
    design: primitives/motorized-mirror.dsn
    instantiation:
      inputs:
        mirror-rotation: ~ inputs['mirror-2-rotation'].value
    pose:
      rotation:
        type: grid
        grid: {z: -z, x: +y}
      translation:
        offset-mm: {z: -7.4}
  cube-insert:
    type: primitive
    primitive:
      static-models:
        gltf: PRT - 2164 - INSGLV - V04.glb
        step: PRT - 2164 - INSGLV - V04.stp
    pose:
      rotation:
        type: grid
        grid: {x: -y}

inputs:
  mirror-1-rotation:
    description: Rotation of mirror 1 about the rotation axis of its motor
    type: float64
    units: deg
    tags:
      - adjustment/electronic
      - actuation/stepper
  mirror-2-rotation:
    description: Rotation of mirror 2 about the rotation axis of its motor
    type: float64
    units: deg
    tags:
      - adjustment/electronic
      - actuation/stepper
