optikit-version: v0.0.0-alpha.1

design:
  description: Two motorized galvo mirrors on a cube insert
  tags:
    - composition/insert-mounted

components:
  motorized-mirror-1:
    kind: design
    design: primitives/motorized-mirror.dsn
    instantiation:
      inputs:
        mirror-rotation: ~ inputs['mirror-1-rotation'].value
    pose:
      rotation:
        kind: grid
        grid: {z: -z}
  motorized-mirror-2:
    kind: design
    design: primitives/motorized-mirror.dsn
    instantiation:
      inputs:
        mirror-rotation: ~ inputs['mirror-2-rotation'].value
    pose:
      rotation:
        kind: grid
        grid: {z: -z, x: +y}
      translation:
        offset-mm: {z: -7.4}
  cube-insert:
    kind: primitive
    primitive:
      static-models:
        gltf: PRT - 2164 - INSGLV - V04.glb
        step: PRT - 2164 - INSGLV - V04.stp
    pose:
      rotation:
        kind: grid
        grid: {x: -y}
    tags:
      - procurement/3d-print
      - in/kit/galvo-box

inputs:
  mirror-1-rotation:
    description: Rotation of mirror 1 about the rotation axis of its motor
    kind: float64
    units: deg
    tags:
      - pose/actuator/orientation
      - adjustment/actuated
      - actuation/rotational/stepper
      - control/electronic
  mirror-2-rotation:
    description: Rotation of mirror 2 about the rotation axis of its motor
    kind: float64
    units: deg
    tags:
      - pose/actuator/orientation
      - adjustment/actuated
      - actuation/rotational/stepper
      - control/electronic
