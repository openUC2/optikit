optikit-version: v0.0.0-alpha.1

design:
  description: A diagonal mirror mounted on a cube insert
  tags:
    - composition/insert-mounted

components:
  inner-insert:
    kind: design
    design: mounted-mirror-inner.dsn
  master-insert-top:
    kind: primitive
    primitive:
      static-models:
        gltf: PRT - 2100 - MASINS - V04 - B.glb
        step: PRT - 2100 - MASINS - V04 - B.stp
    tags:
      - procurement/3d-print
      - in/kit/qbox
  master-insert-bottom:
    kind: primitive
    primitive:
      static-models:
        gltf: PRT - 2100 - MASINS - V04 - B.glb
        step: PRT - 2100 - MASINS - V04 - B.stp
    tags:
      - procurement/3d-print
      - in/kit/qbox

assemblies:
  x:
    description: Normal vector of the mirror is the design's +x basis vector
    children:
      inner-insert: {}
      master-insert-top:
        pose:
          translation:
            offset-mm: {z: 15}
      master-insert-bottom:
        pose:
          rotation:
            kind: grid
            grid: {z: -z}
          translation:
            offset-mm: {z: -15}
  xy:
    description: Normal vector of the mirror is halfway between the design's +x and +y basis vectors
    children:
      inner-insert:
        pose:
          rotation:
            kind: euler
            euler: {z: 45}
      master-insert-top:
        pose:
          translation:
            offset-mm: {z: 15}
      master-insert-bottom:
        pose:
          rotation:
            kind: grid
            grid: {z: -z}
          translation:
            offset-mm: {z: -15}
