optikit-version: v0.0.0-alpha.1

design:
  description: A diagonal mirror mounted on a cube insert
  tags:
    - composition/insert-mounted

components:
  mirror:
    kind: primitive
    primitive:
      static-models:
        gltf: BUY - Mirror - D24x3.glb
        step: BUY - Mirror - D24x3.stp
    pose:
      rotation:
        kind: grid
    tags:
      - optical/mirror/flat
      - optical/mirror/single-sided
      - procurement/buy
      - in/kit/qbox
  adhesive-pad:
    kind: primitive
    primitive:
      static-models:
        gltf: BUY - Adhesive pad - D22x1.glb
        step: BUY - Adhesive pad - D22x1.stp
    pose:
      rotation:
        kind: grid
      translation:
        offset-mm:
          x: ~ -0.5 - 3
    tags:
      - structure/fastener/adhesive
      - procurement/buy
      - in/kit/qbox
  mount-base:
    kind: primitive
    primitive:
      static-models:
        gltf: PRT - 2110 - MASINSMIRHOLLOW - C.glb
        step: PRT - 2110 - MASINSMIRHOLLOW - C.stp
    pose:
      rotation:
        kind: grid
    tags:
      - structure/insert
      - procurement/3d-print
      - in/kit/qbox
  screw-1:
    kind: primitive
    primitive:
      static-models:
        bom: TP lens head screw with TORX - 2.5 x 8 - St - A2K.bom.yml
    tags:
      - structure/fastener/threaded
      - procurement/buy
      - in/kit/qbox
  screw-2:
    kind: primitive
    primitive:
      static-models:
        bom: TP lens head screw with TORX - 2.5 x 8 - St - A2K.bom.yml
    tags:
      - structure/fastener/threaded
      - procurement/buy
      - in/kit/qbox
  mount-top:
    kind: primitive
    primitive:
      static-models:
        gltf: PRT - 2111 - MASINSMIRHOLUPP - C.glb
        step: PRT - 2111 - MASINSMIRHOLUPP - C.stp
    pose:
      rotation:
        kind: grid
    tags:
      - structure/insert
      - procurement/3d-print
      - in/kit/qbox
