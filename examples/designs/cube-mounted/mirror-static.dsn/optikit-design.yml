optikit-version: v0.0.0-alpha.1

design:
  description: A diagonal mirror mounted in a cube, with 90 or 45 deg rotations
  tags:
    - composition/cube-mounted
    - in/kit/qbox

inputs:
  off-axis:
    description: >
      Whether the mirror should be rotated to a 45 deg deflection from the base axis direction
      (i.e. basis vectors) of the cube's coordinate system, as specified by the design variant.
    kind: bool
    tags:
      - pose/insert/orientation
      - adjustment/manual-assembly

components:
  skeleton:
    kind: design
    design: primitives/cube-skeleton.dsn
  mounted-mirror:
    kind: design
    design: mounted-mirror.dsn

assemblies:
  x:
    description: Base direction in the x-axis for the normal vector of the mirror before any off-axis deflection
    children:
      skeleton: {}
      mounted-mirror:
        assembly: "~ inputs['off-axis'].value ? 'xy' : 'x'"
    tags:
      - pose/insert/orientation/horizontal
  z:
    description: Base direction in the z-axis for the normal vector of the mirror before any off-axis deflection
    children:
      skeleton: {}
      mounted-mirror:
        assembly: "~ inputs['off-axis'].value ? 'xy' : 'x'"
        pose:
          rotation:
            kind: grid
            grid: {z: +y, x: +z}
    tags:
      - pose/insert/orientation/vertical
