optikit-version: v0.0.0-alpha.1

design:
  description: A diagonal mirror mounted on a cube insert
  tags:
    - composition/insert-mounted

components:
  mirror:
    kind: primitive
    primitive:
      static-models:
        gltf: BUY - Mirror - 40x30x2.glb
        step: BUY - Mirror - 40x30x2.stp
    pose:
      rotation:
        kind: grid
    tags:
      - optical/mirror/flat
      - optical/mirror/single-sided
      - procurement/buy
      - in/kit/core-box
  adhesive-pad:
    kind: primitive
    primitive:
      static-models:
        gltf: BUY - Adhesive pad - 41x29x1.glb
        step: BUY - Adhesive pad - 41x29x1.stp
    pose:
      rotation:
        kind: grid
      translation:
        offset-mm: {x: -0.5, y: 0.5}
    tags:
      - structure/fastener/adhesive
      - procurement/buy
      - in/kit/core-box
  insert:
    kind: primitive
    primitive:
      static-models:
        gltf: PRT - 2022 - INSMIR45TH2.glb
        step: PRT - 2022 - INSMIR45TH2.stp
    pose:
      rotation:
        kind: grid
    tags:
      - structure/insert
      - procurement/3d-print
      - in/kit/core-box
