optikit-version: v0.0.0-alpha.1

design:
  description: A diagonal mirror mounted in a cube
  tags:
    - cube-mounted
    - mirror
    - mirror/single-sided
    - mirror/flat
    - in/core-box

components:
  skeleton:
    kind: design
    design: primitives/cube-skeleton.dsn
    pose:
      rotation:
        kind: grid
  mounted-mirror:
    kind: design
    design: mounted-mirror.dsn
    pose:
      rotation:
        kind: grid

variants:
  xy:
    description: Normal vector of mirror surface in the x-y plane
    components:
      mounted-mirror:
        pose:
          rotation:
            grid: {x: +y}
  _z:
    description: Normal vector of mirror surface in the y-z plane
    components:
      mounted-mirror:
        pose:
          rotation:
            grid: {z: +y}
