optikit-version: v0.0.0-alpha.1

design:
  description: A 50 mm lens mounted in a cube
  tags:
    - composition/cube-mounted
    - in/core-box

components:
  skeleton:
    kind: design
    design: primitives/cube-skeleton.dsn
    pose:
      rotation:
        kind: grid
  mounted-lens:
    kind: design
    design: mounted-lens.dsn
    pose:
      rotation:
        kind: grid

inputs:
  offset:
    description: Translation of mounted-lens along its normal vector
    kind: float64
    units: mm
    min: -11
    max: 7
    tags:
      - pose/insert/translation
      - adjustment/manual-assembly

variants:
  z:
    description: Normal vector of lens is z-axis
    components:
      mounted-lens:
        pose:
          translation:
            offset-mm:
              z: inputs.offset.value
    tags:
      - pose/insert/orientation/vertical
  x:
    description: Normal vector of lens is x-axis
    components:
      mounted-lens:
        pose:
          rotation:
            grid: {z: +x, x: -z}
          translation:
            offset-mm:
              x: inputs.offset.value
    tags:
      - pose/insert/orientation/horizontal
