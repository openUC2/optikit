optikit-version: v0.0.0-alpha.1

design:
  # Note: see also https://github.com/openUC2/openUC2-optikit-modules-references/blob/main/modules/lenses/lens-pos-50mm/module.yaml
  description: A lens mounted in a cube
  tags:
    - cube-mounted
    - lens
    - lens/convex
    - in/core-box

components:
  skeleton:
    type: design
    design: primitives/cube-skeleton.dsn
    pose:
      rotation:
        type: grid
  mounted-lens:
    type: design
    design: mounted-lens.dsn
    pose:
      rotation:
        type: grid

inputs:
  offset:
    description: Translation of mounted-lens along its normal vector
    type: float64
    units: mm
    min: -11
    max: 7
    tags:
      - adjustment/manual-assembly

variants:
  z:
    description: Normal vector of lens is z-axis
    components:
      mounted-lens:
        pose:
          translation:
            offset-mm:
              z: inputs.offset.value
  x:
    description: Normal vector of lens is x-axis
    components:
      mounted-lens:
        pose:
          rotation:
            grid: {z: +x, x: -z}
          translation:
            offset-mm:
              x: inputs.offset.value
