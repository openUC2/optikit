optikit-version: v0.0.0-alpha.1

design:
  description: A f50 lens mounted on an insert
  tags:
    - composition/insert-mounted

components:
  lens:
    kind: primitive
    primitive:
      static-models:
        gltf: BUY - Lens - f50 D40 sA2.1 sI10.1 cx-cx.glb
        step: BUY - Lens - f50 D40 sA2.1 sI10.1 cx-cx.stp
        # Warning: this is a fake optiland model which doesn't actually correspond to this lens!
        # It's included here only for testing purposes.
        optiland: AC254-100-A-Zemax-ZMX.optiland
    pose:
      rotation:
        kind: grid
    tags:
      - optical/lens/convex
      - procurement/buy
      - in/kit/core-box
  nut:
    kind: primitive
    primitive:
      static-models:
        gltf: PRT - 2003 - NUTD40.glb
        step: PRT - 2003 - NUTD40.stp
    pose:
      rotation:
        kind: grid
    tags:
      - structure/fastener/threaded
      - procurement/3d-print
      - in/kit/core-box
  insert:
    kind: primitive
    primitive:
      static-models:
        gltf: PRT - 2023 - INSLEND40F50 - V04.glb
        step: PRT - 2023 - INSLEND40F50 - V04.stp
    pose:
      rotation:
        kind: grid
    tags:
      - structure/insert
      - procurement/3d-print
      - in/kit/core-box
