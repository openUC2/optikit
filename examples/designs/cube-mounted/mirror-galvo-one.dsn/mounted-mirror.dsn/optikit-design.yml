optikit-version: v0.0.0-alpha.1

design:
  description: One motorized galvo mirror on a cube insert
  tags:
    - composition/insert-mounted

components:
  motorized-mirror:
    kind: design
    design: primitives/motorized-mirror.dsn
    instantiation:
      inputs:
        mirror-rotation: ~ inputs['mirror-rotation'].value
    pose:
      rotation:
        kind: grid
        grid: {z: -z}
  cube-insert:
    kind: primitive
    primitive:
      static-models:
        gltf: PRT - 2164 - INSGLV - V04.glb
        step: PRT - 2164 - INSGLV - V04.stp
    pose:
      rotation:
        kind: grid
        grid: {x: -y}
    tags:
      - procurement/3d-print
      - in/kit/galvo-box

inputs:
  mirror-rotation:
    description: Rotation of mirror about the rotation axis of its motor
    kind: float64
    units: deg
    tags:
      - pose/actuator/orientation
      - adjustment/actuated
      - actuation/rotational/stepper
      - control/electronic
