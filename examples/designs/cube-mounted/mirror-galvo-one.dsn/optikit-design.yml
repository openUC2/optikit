optikit-version: v0.0.0-alpha.1

design:
  description: One motorized galvo mirror in a cube
  tags:
    - composition/cube-mounted

components:
  skeleton:
    kind: design
    design: primitives/cube-skeleton.dsn
    pose:
      rotation:
        kind: grid
  mounted-mirror:
    kind: design
    design: mounted-mirror.dsn
    instantiation:
      inputs:
        mirror-rotation: ~ inputs['mirror-rotation'].value
    pose:
      rotation:
        kind: grid
  skeleton-extra:
    kind: design
    design: primitives/cube-skeleton.dsn
    pose:
      rotation:
        kind: grid

inputs:
  mirror-rotation:
    description: Rotation of mirror about the rotation axis of its motor
    kind: float64
    units: deg
    tags:
      - pose/actuator/orientation
      - adjustment/actuated
      - actuation/rotational/stepper
      - control/electronic

variants:
  x:
    description: Rotational axis of motor is x-axis
    tags:
      - pose/insert/orientation/horizontal
    components:
      skeleton-extra:
        pose:
          translation:
            offset-grid: {x: -1}
  z:
    description: Rotational axis of motor is z-axis
    components:
      mounted-mirror:
        pose:
          rotation:
            grid: {z: +x, x: -z}
      skeleton-extra:
        pose:
          translation:
            offset-grid: {z: 1}
    tags:
      - pose/insert/orientation/vertical
