optikit-version: v0.1.0-alpha.1

design:
  description: A fluorescence microscope with a brightfield and 3 laser channels, and no motorized stage
  tags:
    - instrument
    - instrument/microscope

components:
  led-ring:
    kind: design
    design: cube-mounted/led-ring.dsn
    instantiation:
      inputs:
        newswitch-device-id: led-ring
  laser-1:
    kind: design
    design: primitives/lasers/boison-488.dsn
    instantiation:
      inputs:
        newswitch-device-id: laser-1
  laser-2:
    kind: design
    design: primitives/lasers/boison-488.dsn
    instantiation:
      inputs:
        newswitch-device-id: laser-2
  laser-3:
    kind: design
    design: primitives/lasers/boison-488.dsn
    instantiation:
      inputs:
        newswitch-device-id: laser-3
  standalone-board:
    kind: design
    design: primitives/controllers/standalone-board.dsn
    instantiation:
      inputs:
        newswitch-device-id: standalone-board
  mapping-led-ring:
    kind: design
    design: primitives/controller-mapping.dsn
    instantiation:
      inputs:
        newswitch-controller-id: standalone-board
        newswitch-peripheral-id: led-ring
        newswitch-mapping-type: canopen-led
        id: 30
  mapping-laser-1:
    kind: design
    design: primitives/controller-mapping.dsn
    instantiation:
      inputs:
        newswitch-controller-id: standalone-board
        newswitch-peripheral-id: laser-1
        newswitch-mapping-type: serial-laser
        id: 0
  mapping-laser-2:
    kind: design
    design: primitives/controller-mapping.dsn
    instantiation:
      inputs:
        newswitch-controller-id: standalone-board
        newswitch-peripheral-id: laser-2
        newswitch-mapping-type: serial-laser
        id: 1
  mapping-laser-3:
    kind: design
    design: primitives/controller-mapping.dsn
    instantiation:
      inputs:
        newswitch-controller-id: standalone-board
        newswitch-peripheral-id: laser-3
        newswitch-mapping-type: serial-laser
        id: 2

assemblies:
  wiring:
    children:
      led-ring:
        assembly: wiring
      laser-1:
        assembly: wiring
      laser-2:
        assembly: wiring
      laser-3:
        assembly: wiring
      standalone-board:
        assembly: wiring
        children:
          mapping-led-ring:
            assembly: wiring
          mapping-laser-1:
            assembly: wiring
          mapping-laser-2:
            assembly: wiring
          mapping-laser-3:
            assembly: wiring
