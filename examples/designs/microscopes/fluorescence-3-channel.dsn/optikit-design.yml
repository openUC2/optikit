optikit-version: v0.1.0-alpha.1

design:
  description: A fluorescence microscope with a brightfield and 3 laser channels, and no motorized stage
  tags:
    - instrument
    - instrument/microscope

components:
  root-controller:
    kind: design
    design: primitives/controllers/root.dsn
  camera:
    kind: design
    design: primitives/hikcamera-with-objective.dsn
    instantiation:
      inputs:
        newswitch-device-id: camera
  connection-camera:
    kind: design
    design: primitives/connections/usb3-vision.dsn
    instantiation:
      inputs:
        newswitch-controller-id: root
        newswitch-peripheral-id: camera
  standalone-board:
    kind: design
    design: primitives/controllers/standalone-board.dsn
    instantiation:
      inputs:
        newswitch-device-id: standalone-board
  connection-standalone-board:
    kind: design
    design: primitives/connections/uc2-rest-serial.dsn
    instantiation:
      inputs:
        newswitch-controller-id: root
        newswitch-peripheral-id: standalone-board
        port-pattern: /dev/ttyUSB*
        baudrate: 115200
  led:
    kind: design
    design: cube-mounted/led-ring.dsn
    instantiation:
      inputs:
        newswitch-device-id-led: led
  connection-led:
    kind: design
    design: primitives/connections/canopen-peripheral.dsn
    instantiation:
      inputs:
        newswitch-controller-id: standalone-board
        newswitch-peripheral-id: led
        protocol: canopen-pwm
        id: 30
        pwm-max: 1023
  laser-1:
    kind: design
    design: primitives/lasers/boison-488.dsn
    instantiation:
      inputs:
        newswitch-device-id: laser-1
  connection-laser-1:
    kind: design
    design: primitives/connections/canopen-peripheral.dsn
    instantiation:
      inputs:
        newswitch-controller-id: standalone-board
        newswitch-peripheral-id: laser-1
        protocol: canopen-pwm
        id: 0
        pwm-max: 1023
  laser-2:
    kind: design
    design: primitives/lasers/boison-488.dsn
    instantiation:
      inputs:
        newswitch-device-id: laser-2
  connection-laser-2:
    kind: design
    design: primitives/connections/canopen-peripheral.dsn
    instantiation:
      inputs:
        newswitch-controller-id: standalone-board
        newswitch-peripheral-id: laser-2
        protocol: canopen-pwm
        id: 1
        pwm-max: 1023
  laser-3:
    kind: design
    design: primitives/lasers/boison-488.dsn
    instantiation:
      inputs:
        newswitch-device-id: laser-3
  connection-laser-3:
    kind: design
    design: primitives/connections/canopen-peripheral.dsn
    instantiation:
      inputs:
        newswitch-controller-id: standalone-board
        newswitch-peripheral-id: laser-3
        protocol: canopen-pwm
        id: 2
        pwm-max: 1023

assemblies:
  wiring:
    children:
      root-controller:
        assembly: wiring
        children:
          connection-camera:
            assembly: wiring
          connection-standalone-board:
            assembly: wiring
      camera:
        assembly: wiring
      standalone-board:
        assembly: wiring
        children:
          connection-led:
            assembly: wiring
          connection-laser-1:
            assembly: wiring
          connection-laser-2:
            assembly: wiring
          connection-laser-3:
            assembly: wiring
      led:
        assembly: wiring
      laser-1:
        assembly: wiring
      laser-2:
        assembly: wiring
      laser-3:
        assembly: wiring
