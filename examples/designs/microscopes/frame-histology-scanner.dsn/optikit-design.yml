optikit-version: v0.1.0-alpha.1

design:
  description: A FRAME configured as a histology scanner
  tags:
    - instrument
    - instrument/microscope

inputs:
  sample-x:
    description: Extension of the sample stage's x-axis actuator
    kind: float64
    units: mm
    min: 0
    max: 25
    tags:
      - pose/actuator/translation
      - adjustment/electronic
  sample-y:
    description: Extension of the sample stage's y-axis actuator
    kind: float64
    units: mm
    min: 0
    max: 25
    tags:
      - pose/actuator/translation
      - adjustment/electronic
  sample-z:
    description: Extension of the sample stage's z-axis actuator
    kind: float64
    units: mm
    min: 0
    max: 25
    tags:
      - pose/actuator/translation
      - adjustment/electronic
  objective-a:
    description: Extension of the objective changer's a-axis actuator
    kind: float64
    units: mm
    min: 0
    max: 25
    tags:
      - pose/actuator/translation
      - adjustment/electronic

components:
  root-controller:
    kind: design
    design: primitives/controllers/root.dsn
  camera:
    kind: design
    design: primitives/hikcamera-with-objective.dsn
    instantiation:
      inputs:
        newswitch-device-id: camera
  connection-camera:
    kind: design
    design: primitives/connections/usb3-vision.dsn
    instantiation:
      inputs:
        newswitch-controller-id: root
        newswitch-peripheral-id: camera
  hat-plus:
    kind: design
    design: primitives/controllers/hat-plus.dsn
    instantiation:
      inputs:
        newswitch-device-id: hat-plus
  connection-hat-plus:
    kind: design
    design: primitives/connections/canopen-canbus.dsn
    instantiation:
      inputs:
        newswitch-controller-id: root
        newswitch-peripheral-id: hat-plus
        interface: socketcan
        channel: can0
        bitrate: 500000
  led-ring:
    kind: design
    design: cube-mounted/led-ring.dsn
    instantiation:
      inputs:
        newswitch-device-id-led: led-ring/led
        newswitch-device-id-matrix: led-ring/matrix
  connection-led:
    kind: design
    design: primitives/connections/direct.dsn
    instantiation:
      inputs:
        newswitch-controller-id: hat-plus
        newswitch-peripheral-id: led-ring/led
        id: 21
        subid: 0
  connection-led-matrix:
    kind: design
    design: primitives/connections/direct.dsn
    instantiation:
      inputs:
        newswitch-controller-id: hat-plus
        newswitch-peripheral-id: led-ring/matrix
        id: 30
  frame-chassis:
    kind: design
    design: assemblies/frame-chassis.dsn
    instantiation:
      inputs:
        newswitch-device-id-sample: frame-chassis/sample
        newswitch-device-id-sample-x: frame-chassis/sample/x
        newswitch-device-id-sample-y: frame-chassis/sample/y
        newswitch-device-id-sample-z: frame-chassis/sample/z
        newswitch-device-id-objective: frame-chassis/objective
        newswitch-device-id-objective-a: frame-chassis/objective/a
        newswitch-input-variable-sample-x: sample-x
        newswitch-input-variable-sample-y: sample-y
        newswitch-input-variable-sample-z: sample-z
        newswitch-input-variable-objective-a: objective-a
        position-sample-x: ~ inputs['sample-x'].value
        position-sample-y: ~ inputs['sample-y'].value
        position-sample-z: ~ inputs['sample-z'].value
        position-objective-a: ~ inputs['objective-a'].value
  connection-axis-x:
    kind: design
    design: primitives/connections/direct.dsn
    instantiation:
      inputs:
        newswitch-controller-id: hat-plus
        newswitch-peripheral-id: frame-chassis/x
        id: 11
        subid: 1
  connection-axis-y:
    kind: design
    design: primitives/connections/direct.dsn
    instantiation:
      inputs:
        newswitch-controller-id: hat-plus
        newswitch-peripheral-id: frame-chassis/y
        id: 12
        subid: 1
  connection-axis-z:
    kind: design
    design: primitives/connections/direct.dsn
    instantiation:
      inputs:
        newswitch-controller-id: hat-plus
        newswitch-peripheral-id: frame-chassis/z
        id: 13
        subid: 1
  connection-axis-a:
    kind: design
    design: primitives/connections/direct.dsn
    instantiation:
      inputs:
        newswitch-controller-id: hat-plus
        newswitch-peripheral-id: frame-chassis/a
        id: 10
        subid: 1

assemblies:
  wiring:
    children:
      root-controller:
        assembly: wiring
        children:
          connection-camera:
            assembly: wiring
          connection-hat-plus:
            assembly: wiring
      camera:
        assembly: wiring
      hat-plus:
        assembly: wiring
        children:
          connection-led:
            assembly: wiring
          connection-led-matrix:
            assembly: wiring
          connection-axis-x:
            assembly: wiring
          connection-axis-y:
            assembly: wiring
          connection-axis-z:
            assembly: wiring
          connection-axis-a:
            assembly: wiring
      led-ring:
        assembly: wiring
      frame-chassis:
        assembly: wiring
