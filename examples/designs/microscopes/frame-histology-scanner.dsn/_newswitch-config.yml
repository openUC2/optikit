devices:
  camera:
    binning: 1
    channels: 1
    exposure_time_ms:
      inc: 0.001
      max: 10000.0
      min: 0.024
      unit: ms
      value: 25.0
    framerate_per_sec:
      max: 163.0
      min: 0.5
      unit: Hz
      value: 163.0
    gain_db:
      inc: 0.01
      max: 23.98
      min: 0.0
      unit: dB
      value: 0.0
    manufacturer: HIK ROBOTICS
    name: MV-CA023-10UM
    pixelcount:
    - 1920
    - 1200
    pixelpitch_um: 10.0
    tags:
    - monochrome
    - global-shutter
    - gige
    trigger:
      edge: rising
      type: hardware
    type: detector
  frame-chassis/objective:
    axes:
      a: frame-chassis/objective/a
    homing_order:
    - a
    manufacturer: openUC2
    name: frame-objective
    type: stage
  frame-chassis/objective/a:
    homing_required: true
    manufacturer: openUC2
    name: objective-changer
    optikit_dsn_variable: objective-a
    pos:
      max: 10000.0
      min: 0.0
      unit: um
    steps_per_um: 8.0
    type: axis
    vel:
      unit: um/s
      value: 5000.0
  frame-chassis/sample:
    axes:
      x: frame-chassis/sample/x
      y: frame-chassis/sample/y
      z: frame-chassis/sample/z
    homing_order:
    - z
    - y
    - x
    manufacturer: openUC2
    name: frame-sample
    type: stage
  frame-chassis/sample/x:
    homing_required: true
    manufacturer: openUC2
    name: frame-xy
    optikit_dsn_variable: sample-x
    pos:
      max: 5000000.0
      min: 0.0
      unit: um
    steps_per_um: 8.0
    type: axis
    vel:
      unit: um/s
      value: 10000.0
  frame-chassis/sample/y:
    homing_required: true
    manufacturer: openUC2
    name: frame-xy
    optikit_dsn_variable: sample-y
    pos:
      max: 5000000.0
      min: 0.0
      unit: um
    steps_per_um: 8.0
    type: axis
    vel:
      unit: um/s
      value: 10000.0
  frame-chassis/sample/z:
    homing_required: true
    manufacturer: openUC2
    name: frame-z
    optikit_dsn_variable: sample-z
    pos:
      max: 10000.0
      min: 0.0
      unit: um
    steps_per_um: 8.0
    type: axis
    vel:
      unit: um/s
      value: 5000.0
  hat-plus:
    connections:
      frame-chassis/a:
        protocol: direct
        selectors:
          id: 0
          subid: 0
      frame-chassis/x:
        protocol: direct
        selectors:
          id: 1
          subid: 0
      frame-chassis/y:
        protocol: direct
        selectors:
          id: 2
          subid: 0
      frame-chassis/z:
        protocol: direct
        selectors:
          id: 3
          subid: 0
      led-ring/led:
        protocol: direct
        selectors:
          id: 0
          subid: 0
      led-ring/matrix:
        protocol: direct
        selectors:
          id: 0
          subid: 0
    manufacturer: openUC2
    name: HAT+
    type: controller
  led-ring/led:
    channels: 1
    type: lightsource
  led-ring/matrix:
    channels: 1
    type: lightsource
  root:
    connections:
      camera:
        protocol: usb3-vision
        selectors:
          user_defined_name: ''
      hat-plus:
        protocol: canopen
        transport:
          bitrate: 500000
          interface: socketcan
          selectors:
            channel: can0
          type: can
    type: controller
newswitch_version: v1.0.2
