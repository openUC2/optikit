newswitch_version: v1.0.2
devices:
  root: # Note: The root device is the top-level controller, and corresponds to the computer running NewSwitch
    type: controller
    connections: # Note: `mapping` is renamed to `connections`.
      hat-plus:
        protocol: can-bus # Note: `mapping.<devKey>.type` is merged into `protocol`.
        transport:
          type: can
          interface: socketcan
          selectors: # Note: `selectors` contains device identifiers used for binding to hardware
            channel: can0
          bitrate: 500000
      main-camera:
        protocol: usb3-vision
        selectors: # Note: selectors would contain serial_number, user_defined_name, and index
          serial_number: null # Note: here null means "automatically detect the required serial ID if it's not already specified in the NewSwitch persistent state"
  main-camera:
    type: detector
    name: MV-CA023-10UM
    manufacturer: HIK ROBOTICS
    binning: 1
    channels: 1
    exposure_time_ms:
      inc: 0.001
      max: 10000.0
      min: 0.024
      unit: ms
      value: 25.0
    framerate_per_sec:
      max: 163.0
      min: 0.5
      unit: Hz
      value: 163.0
    gain_db:
      inc: 0.01
      max: 23.98
      min: 0.0
      unit: dB
      value: 0.0
    pixelcount:
    - 1920
    - 1200
    pixelpitch_um: 10.0
    tags:
    - monochrome
    - global-shutter
    - gige
    trigger:
      edge: rising
      type: hardware
  hat-plus:
    type: controller
    name: HAT+ via CAN
    manufacturer: openUC2
    connections:
      led-ring/led:
        protocol: canopen-pwm # Note: or we could call this "canopen" instead
        selectors:
          id: 20
          subid: 4
        pwm_max: 1023
      led-ring/matrix:
        protocol: canopen-pwm # Note: or we could call this "canopen" instead
        selectors:
          id: 30
          subid: 0
        pwm_max: 1023
      frame-chassis/a:
        type: canopen
        selectors:
          id: 10
          subid: 1
      frame-chassis/x:
        type: canopen
        selectors:
          id: 11
          subid: 1
      frame-chassis/y:
        type: canopen
        selectors:
          id: 12
          subid: 1
      frame-chassis/z:
        type: canopen
        selectors:
          id: 13
          subid: 1
  led-ring/led:
    channels: 1
    type: lightsource
  led-ring/matrix:
    channels: 1
    type: lightsource
  frame-chassis/objective:
    type: stage
    name: frame-objective
    manufacturer: openUC2
    axes:
      a: frame-chassis/objective/a
    homing_order:
    - a
  frame-chassis/objective/a:
    type: axis
    name: objective-changer
    manufacturer: openUC2
    homing_required: true
    optikit_dsn_variable: objective-a
    pos:
      max: 10000.0
      min: 0.0
      unit: um
    steps_per_um: 8.0
    vel:
      unit: um/s
      value: 5000.0
  frame-chassis/sample:
    type: stage
    name: frame-sample
    manufacturer: openUC2
    axes:
      x: frame-chassis/sample/x
      y: frame-chassis/sample/y
      z: frame-chassis/sample/z
    homing_order:
    - z
    - y
    - x
  frame-chassis/sample/x:
    type: axis
    name: frame-xy
    manufacturer: openUC2
    homing_required: true
    optikit_dsn_variable: sample-x
    pos:
      max: 5000000.0
      min: 0.0
      unit: um
    steps_per_um: 8.0
    vel:
      unit: um/s
      value: 10000.0
  frame-chassis/sample/y:
    type: axis
    name: frame-xy
    manufacturer: openUC2
    homing_required: true
    optikit_dsn_variable: sample-y
    pos:
      max: 5000000.0
      min: 0.0
      unit: um
    steps_per_um: 8.0
    vel:
      unit: um/s
      value: 10000.0
  frame-chassis/sample/z:
    type: axis
    name: frame-z
    manufacturer: openUC2
    homing_required: true
    optikit_dsn_variable: sample-z
    pos:
      max: 10000.0
      min: 0.0
      unit: um
    steps_per_um: 8.0
    vel:
      unit: um/s
      value: 5000.0
