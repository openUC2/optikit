optikit-version: v0.1.0-alpha.1

design:
  description: A minimal 2-D microscope consisting of components whose 3-D positions are specified relative to each other.
  tags:
    - instrument
    - instrument/microscope

components:
  light-source:
    kind: design
    design: primitives/flashlight.dsn
  sample-holder:
    kind: design
    design: cube-mounted/slide-holder.dsn
    instantiation:
      inputs:
        offset: 7
  objective-lens:
    kind: design
    design: cube-mounted/lens.dsn
    instantiation:
      inputs:
        offset: 5
  periscope-mirror-1:
    kind: design
    design: cube-mounted/mirror-static.dsn
    instantiation:
      inputs:
        off-axis: true
  periscope-mirror-2:
    kind: design
    design: cube-mounted/mirror-static.dsn
    instantiation:
      inputs:
        off-axis: true
  tube-lens:
    kind: design
    design: cube-mounted/lens.dsn
    instantiation:
      inputs:
        offset: -8
  projector-screen:
    kind: design
    design: primitives/projector-screen.dsn

assemblies:
  '':
    children:
      sample-holder:
        assembly: x
        children:
          light-source:
            pose:
              kind: relative-translation
              rotation:
                kind: grid
                grid: {z: +x, x: -z}
              translation:
                offset-mm: {x: -80}
          objective-lens:
            assembly: x
            pose:
              kind: relative-translation
              translation:
                offset-grid: {x: 1}
            children:
              periscope-mirror-1:
                assembly: x
                pose:
                  kind: relative-translation
                  rotation:
                    kind: uc2
                    grid: {x: +y}
                  translation:
                    offset-grid: {x: 1}
                children:
                  periscope-mirror-2:
                    assembly: z
                    pose:
                      kind: relative-translation
                      rotation:
                        kind: uc2
                        grid: {x: -y}
                      translation:
                        offset-grid: {y: 5}
                    children:
                      tube-lens:
                        assembly: z
                        pose:
                          kind: relative-translation
                          translation:
                            offset-grid: {z: 3}
                        children:
                          projector-screen:
                            pose:
                              kind: relative-translation
                              translation:
                                kind: mm
                                offset-mm: {z: 100}
