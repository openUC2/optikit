newswitch-version: v0.1.0-alpha.0
devices:
  hotlaser123:
    name: boison-488
    manufacturer: Boison
    type: laser
    wavelength_nm: 485
    max_power_mw: 100.0
    modulation: digital
    shutter: false
    controller: my-favorite-mainboard
    device_id: hotlaser123
  bigcamera42:
    name: MV-CA023-10UM
    manufacturer: HIK ROBOTICS
    tags:
      - monochrome
      - global-shutter
      - gige
    type: camera
    pixelcount:
      x: 1920
      y: 1200
      pixelpitch_um:
        x: 10.0
      channels: 1
      exposure_time_ms:
        value: 25.0
        min: 0.024
        max: 10000.0
        increment: 0.001
      framerate_per_sec:
        value: 163.0
        min: 0.5
        max: 163.0
      gain_db:
        value: 0.0
        min: 0.0
        max: 23.98
        increment: 0.01
      binning: 1
      trigger:
        type: hardware
        edge: rising
    device_id: bigcamera42
  my-favorite-mainboard:
    name: UC2-Mainboard-v4
    manufacturer: openUC2
    type: controller-board
    protocol: uc2-rest # can be uc2-rest or can-open
    uc2-rest:
      transport: serial # can be serial or HTTP
      serial:
        device-pattern: '/dev/ttyUSB*'
        baudrate: 115200
    firmware:
      name: esp32-uc2-standalone-4
      version: v2026.0.0-beta.3
    device_id: my-favorite-mainboard
  just-some-boring-stage:
    name: xyz-linear-100
    manufacturer: openUC2
    type: stage
    axes:
      - label: x
        travel_um: 100000.0
        steps_per_um: 8.0
        inverted: false
      - label: y
        travel_um: 100000.0
        steps_per_um: 8.0
        inverted: false
      - label: z
        travel_um: 10000.0
        steps_per_um: 25.0
        inverted: true
    max_speed_um_per_sec: 5000.0
    homing_required: true
    device_id: just-some-boring-stage
