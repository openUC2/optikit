optikit-version: v0.1.0-alpha.1

design:
  description: A minimal fluorescence microscope with a laser and camera and xyz stage
  tags:
    - instrument
    - instrument/microscope

inputs:
  sample-x:
    description: Extension of the sample stage's x-axis actuator
    kind: float64
    units: mm
    min: 0
    max: 25
    tags:
      - pose/actuator/translation
      - adjustment/electronic
  sample-y:
    description: Extension of the sample stage's y-axis actuator
    kind: float64
    units: mm
    min: 0
    max: 25
    tags:
      - pose/actuator/translation
      - adjustment/electronic
  sample-z:
    description: Extension of the sample stage's z-axis actuator
    kind: float64
    units: mm
    min: 0
    max: 25
    tags:
      - pose/actuator/translation
      - adjustment/electronic

components:
  root-controller:
    kind: design
    design: primitives/controllers/root.dsn
  camera:
    kind: design
    design: primitives/hikcamera-with-objective.dsn
    instantiation:
      inputs:
        newswitch-device-id: camera
  connection-camera:
    kind: design
    design: primitives/connections/usb3-vision.dsn
    instantiation:
      inputs:
        newswitch-controller-id: root
        newswitch-peripheral-id: camera
  standalone-board:
    kind: design
    design: primitives/controllers/standalone-board.dsn
    instantiation:
      inputs:
        newswitch-device-id: standalone-board
  connection-standalone-board:
    kind: design
    design: primitives/connections/uc2-rest-serial.dsn
    instantiation:
      inputs:
        newswitch-controller-id: root
        newswitch-peripheral-id: standalone-board
        port-pattern: /dev/ttyUSB*
        baudrate: 115200
  dichroic:
    kind: design
    design: cube-mounted/dichroic-mirror.dsn
  objective:
    kind: design
    design: cube-mounted/lens.dsn
    instantiation:
      offset: 0
  laser-mirror:
    kind: design
    design: cube-mounted/mirror-diagonal.dsn
  fiber-holder:
    kind: design
    design: cube-mounted/fiber-holder.dsn
  blue-laser:
    kind: design
    design: primitives/lasers/boison-488.dsn
    instantiation:
      inputs:
        newswitch-device-id: laser
  connection-laser:
    kind: design
    design: primitives/connections/direct.dsn
    instantiation:
      inputs:
        newswitch-controller-id: standalone-board
        newswitch-peripheral-id: laser
        id: 0
  sample-mirror:
    kind: design
    design: cube-mounted/mirror-diagonal.dsn
  sample-stage:
    kind: design
    design: primitives/xyz-stage.dsn
    instantiation:
      inputs:
        newswitch-device-id: sample-stage
        newswitch-device-id-x: sample-stage/x
        newswitch-device-id-y: sample-stage/y
        newswitch-device-id-z: sample-stage/z
        newswitch-input-variable-x: sample-x
        newswitch-input-variable-y: sample-y
        newswitch-input-variable-z: sample-z
        position-x: ~ inputs['sample-x'].value
        position-y: ~ inputs['sample-y'].value
        position-z: ~ inputs['sample-z'].value
        # position-x: 2
        # position-y: 4
        # position-z: 8
  slide-holder:
    kind: design
    design: cube-mounted/slide-holder.dsn/mounted-holder.dsn
  connection-sample-stage-x:
    kind: design
    design: primitives/connections/direct.dsn
    instantiation:
      inputs:
        newswitch-controller-id: standalone-board
        newswitch-peripheral-id: sample-stage/x
  connection-sample-stage-y:
    kind: design
    design: primitives/connections/direct.dsn
    instantiation:
      inputs:
        newswitch-controller-id: standalone-board
        newswitch-peripheral-id: sample-stage/y
        id: 1
  connection-sample-stage-z:
    kind: design
    design: primitives/connections/direct.dsn
    instantiation:
      inputs:
        newswitch-controller-id: standalone-board
        newswitch-peripheral-id: sample-stage/z
        id: 2

assemblies:
  '':
    children:
      camera:
        children:
          dichroic:
            assembly: xy
            pose:
              kind: relative-translation
              rotation:
                kind: uc2
                grid: {z: -z}
              translation:
                offset-grid: {x: 1}
            children:
              objective:
                assembly: x
                pose:
                  kind: relative-translation
                  translation:
                    offset-grid: {x: 1}
                children:
                  sample-mirror:
                    assembly: _z
                    pose:
                      kind: relative-translation
                      rotation:
                        kind: uc2
                        grid: {z: -z, x: -x}
                      translation:
                        offset-grid: {x: 1}
                    children:
                      sample-stage:
                        pose:
                          kind: relative-translation
                          translation:
                            offset-grid: {z: -2}
                            offset-mm: {z: -25}
                        children:
                          slide-holder:
                            pose:
                              base:
                                kind: mate
                                mate: stage-center
                              rotation:
                                kind: grid
                                grid: {z: -z}
                              translation:
                                offset-mm: {z: 3}
              laser-mirror:
                assembly: xy
                pose:
                  kind: relative-translation
                  rotation:
                    kind: uc2
                    grid: {x: +y}
                  translation:
                    offset-grid: {y: -1}
                children:
                  fiber-holder:
                    assembly: x
                    pose:
                      kind: relative-translation
                      rotation:
                        kind: uc2
                      translation:
                        offset-grid: {x: -1}
      blue-laser:
        pose:
          rotation:
            kind: uc2
            grid: {x: -x}
          translation:
            offset-grid: {x: 1, y: 1}
      standalone-board:
        pose:
          rotation:
            kind: uc2
            grid: {z: -z}
          translation:
            offset-grid: {z: -1}
            offset-mm: {x: 25, y: 25, z: ~ 25}
  wiring:
    children:
      root-controller:
        assembly: wiring
        children:
          connection-camera:
            assembly: wiring
          connection-standalone-board:
            assembly: wiring
      camera:
        assembly: wiring
      standalone-board:
        assembly: wiring
        children:
          connection-laser:
            assembly: wiring
          connection-sample-stage-x:
            assembly: wiring
          connection-sample-stage-y:
            assembly: wiring
          connection-sample-stage-z:
            assembly: wiring
      blue-laser:
        assembly: wiring
      sample-stage:
        assembly: wiring
