optikit-version: v0.1.0-alpha.1

design:
  description: A minimal 2-D microscope consisting of components whose positions are specified relative to the overall design.
  tags:
    - instrument
    - instrument/microscope

components:
  light-source:
    kind: design
    design: primitives/flashlight.dsn
  sample-holder:
    kind: location
    tags:
      - subkind/group
  sample-holder-insert:
    kind: design
    design: cube-mounted/slide-holder.dsn/mounted-holder.dsn
  sample-holder-skeleton:
    kind: design
    design: primitives/cube-skeleton.dsn
  objective-lens:
    kind: location
    tags:
      - subkind/group
  objective-lens-insert:
    kind: design
    design: cube-mounted/lens.dsn/mounted-lens.dsn
    instantiation:
      inputs:
        offset: 5
  objective-lens-skeleton:
    kind: design
    design: primitives/cube-skeleton.dsn
  periscope-mirror-1:
    kind: design
    design: cube-mounted/mirror-diagonal.dsn/mounted-mirror.dsn
  periscope-mirror-1-skeleton:
    kind: design
    design: primitives/cube-skeleton.dsn
  periscope-mirror-2:
    kind: design
    design: cube-mounted/mirror-diagonal.dsn/mounted-mirror.dsn
  periscope-mirror-2-skeleton:
    kind: design
    design: primitives/cube-skeleton.dsn
  tube-lens:
    kind: location
    tags:
      - subkind/group
  tube-lens-insert:
    kind: design
    design: cube-mounted/lens.dsn/mounted-lens.dsn
  tube-lens-skeleton:
    kind: design
    design: primitives/cube-skeleton.dsn
  projector-screen:
    kind: design
    design: primitives/projector-screen.dsn

assemblies:
  '':
    children:
      light-source:
        pose:
          rotation:
            kind: grid
            grid: {z: +x, x: -z}
          translation:
            offset-mm: {x: -80}
      sample-holder:
        children:
          sample-holder-insert:
            pose:
              kind: relative-translation
              rotation:
                kind: grid
                grid: {z: +x, x: -z}
              translation:
                offset-mm:
                  x: ~ 5 + 7
          sample-holder-skeleton:
            pose:
              kind: relative-translation
      objective-lens:
        pose:
          translation:
            offset-grid: {x: 1}
        children:
          objective-lens-insert:
            pose:
              kind: relative-translation
              rotation:
                kind: grid
                grid: {z: +x, x: -z}
              translation:
                offset-mm:
                  x: 5
          objective-lens-skeleton:
            pose:
              kind: relative-translation
      periscope-mirror-1:
        pose:
          rotation:
            kind: grid
            grid: {x: -x}
          translation:
            offset-grid: {x: 2}
        children:
          periscope-mirror-1-skeleton:
            pose:
              kind: relative-translation
      periscope-mirror-2:
        pose:
          translation:
            offset-grid: {x: 2, y: 10}
        children:
          periscope-mirror-2-skeleton:
            pose:
              kind: relative-translation
      tube-lens:
        pose:
          translation:
            offset-grid: {x: 5, y: 10}
        children:
          tube-lens-insert:
            pose:
              kind: relative-translation
              rotation:
                kind: grid
                grid: {z: +x, x: -z}
              translation:
                offset-mm: {x: -8}
          tube-lens-skeleton:
            pose:
              kind: relative-translation
      projector-screen:
        pose:
          rotation:
            kind: grid
            grid: {z: -x, x: +z}
          translation:
            offset-grid: {x: 5, y: 10}
            offset-mm: {x: 100}
