optikit-version: v0.0.0-alpha.1

design:
  description: A minimal 2-D microscope consisting of components whose positions are specified relative to the overall design.
  tags:
    - instrument
    - instrument/microscope

components:
  light-source:
    kind: design
    design: primitives/flashlight.dsn
    pose:
      rotation:
        kind: grid
        grid: {z: +x, x: -z}
      translation:
        offset-mm: {x: -80}
  sample-holder-gridded-anchor:
    # This is the center of the grid cell; this must be modeled because the sample holder insert can move relative to the center of the grid cell!
    kind: location
    pose:
      rotation:
        kind: grid
  sample-holder-insert:
    kind: design
    design: cube-mounted/slide-holder.dsn/mounted-holder.dsn
    pose:
      rotation:
        kind: grid
        grid: {z: +x, x: -z}
      translation:
        anchor: sample-holder-gridded-anchor
        offset-mm:
          x: ~ 5 + 7
  sample-holder-skeleton:
    kind: design
    design: primitives/cube-skeleton.dsn
    pose:
      rotation:
        kind: uc2
      translation:
        anchor: sample-holder-gridded-anchor
  objective-lens-gridded-anchor:
    # This is the center of the grid cell; this must be modeled because the sample holder insert can move relative to the center of the grid cell!
    kind: location
    pose:
      rotation:
        kind: grid
      translation:
        offset-grid: {x: 1}
  objective-lens-insert:
    kind: design
    design: cube-mounted/lens.dsn/mounted-lens.dsn
    instantiation:
      inputs:
        offset: 5
    pose:
      rotation:
        kind: grid
        grid: {z: +x, x: -z}
      translation:
        anchor: objective-lens-gridded-anchor
        offset-mm:
          x: 5
  objective-lens-skeleton:
    kind: design
    design: primitives/cube-skeleton.dsn
    pose:
      rotation:
        kind: uc2
      translation:
        anchor: objective-lens-gridded-anchor
  periscope-mirror-1:
    kind: design
    design: cube-mounted/mirror-diagonal.dsn/mounted-mirror.dsn
    pose:
      rotation:
        kind: grid
        grid: {x: -x}
      translation:
        offset-grid: {x: 2}
  periscope-mirror-1-skeleton:
    kind: design
    design: primitives/cube-skeleton.dsn
    pose:
      rotation:
        kind: uc2
      translation:
        anchor: periscope-mirror-1
  periscope-mirror-2:
    kind: design
    design: cube-mounted/mirror-diagonal.dsn/mounted-mirror.dsn
    pose:
      rotation:
        kind: grid
      translation:
        offset-grid: {x: 2, y: 10}
  periscope-mirror-2-skeleton:
    kind: design
    design: primitives/cube-skeleton.dsn
    pose:
      rotation:
        kind: uc2
      translation:
        anchor: periscope-mirror-2
  tube-lens-anchor:
    # This is the center of the grid cell; this must be modeled because the sample holder insert can move relative to the center of the grid cell!
    kind: location
    pose:
      rotation:
        kind: grid
      translation:
        offset-grid: {x: 5, y: 10}
  tube-lens-insert:
    kind: design
    design: cube-mounted/lens.dsn/mounted-lens.dsn
    pose:
      rotation:
        kind: grid
        grid: {z: +x, x: -z}
      translation:
        anchor: tube-lens-anchor
        offset-mm: {x: -8}
  tube-lens-skeleton:
    kind: design
    design: primitives/cube-skeleton.dsn
    pose:
      rotation:
        kind: uc2
      translation:
        anchor: tube-lens-anchor
  projector-screen:
    kind: design
    design: primitives/projector-screen.dsn
    pose:
      rotation:
        kind: grid
        grid: {z: -x, x: +z}
      translation:
        offset-grid: {x: 5, y: 10}
        offset-mm: {x: 100}

relations:
  geometry:
  logic:
