optikit-version: v0.0.0-alpha.1

design:
  description: A minimal 2-D microscope consisting of components whose positions are specified relative to the overall design.
  tags:
    - instrument
    - instrument/microscope

components:
  light-source:
    kind: design
    design: primitives/flashlight.dsn
  sample-holder:
    kind: design
    design: cube-mounted/slide-holder.dsn
    instantiation:
      inputs:
        offset: 7
  objective-lens:
    kind: design
    design: cube-mounted/lens.dsn
    instantiation:
      inputs:
        offset: 5
  periscope-mirror-1:
    kind: design
    design: cube-mounted/mirror-diagonal.dsn
  periscope-mirror-2:
    kind: design
    design: cube-mounted/mirror-diagonal.dsn
  tube-lens:
    kind: design
    design: cube-mounted/lens.dsn
    instantiation:
      inputs:
        offset: -8
  projector-screen:
    kind: design
    design: primitives/projector-screen.dsn

assemblies:
  '':
    children:
      light-source:
        pose:
          rotation:
            kind: grid
            grid: {z: +x, x: -z}
          translation:
            offset-mm: {x: -80}
      sample-holder:
        assembly: x
      objective-lens:
        assembly: x
        pose:
          translation:
            offset-grid: {x: 1}
      periscope-mirror-1:
        assembly: xy
        pose:
          rotation:
            kind: uc2
            grid: {x: +y}
          translation:
            offset-grid: {x: 2}
      periscope-mirror-2:
        assembly: xy
        pose:
          rotation:
            kind: uc2
            grid: {x: -y}
          translation:
            offset-grid: {x: 2, y: 10}
      tube-lens:
        assembly: x
        pose:
          translation:
            offset-grid: {x: 5, y: 10}
      projector-screen:
        pose:
          rotation:
            kind: grid
            grid: {z: -x, x: +z}
          translation:
            offset-grid: {x: 5, y: 10}
            offset-mm: {x: 100}
