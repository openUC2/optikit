optikit-version: v0.1.0-alpha.1

design:
  description: A light-sheet microscope
  tags:
    - instrument
    - instrument/microscope

inputs:
  stage-x:
    description: Extension of the xyz stage's x-axis actuator
    kind: float64
    units: mm
    min: 0
    max: 25
    tags:
      - pose/actuator/translation
      - adjustment/electronic
  stage-y:
    description: Extension of the xyz stage's y-axis actuator
    kind: float64
    units: mm
    min: 0
    max: 25
    tags:
      - pose/actuator/translation
      - adjustment/electronic
  stage-z:
    description: Extension of the standalone linear actuator
    kind: float64
    units: mm
    min: 0
    max: 25
    tags:
      - pose/actuator/translation
      - adjustment/electronic
  stage-a:
    description: Extension of the xyz stage's z-axis actuator
    kind: float64
    units: mm
    min: 0
    max: 25
    tags:
      - pose/actuator/translation
      - adjustment/electronic

components:
  led:
    kind: design
    design: cube-mounted/led-ring.dsn
    instantiation:
      inputs:
        newswitch-device-id-led: led
  laser:
    kind: design
    design: primitives/lasers/boison-488.dsn
    instantiation:
      inputs:
        newswitch-device-id: laser
  xyz-stage:
    kind: design
    design: primitives/xyz-stage.dsn
    instantiation:
      inputs:
        newswitch-device-id: xyz-stage
        newswitch-device-id-x: xyz-stage/x
        newswitch-device-id-y: xyz-stage/y
        newswitch-device-id-z: xyz-stage/a
        newswitch-input-variable-x: stage-x
        newswitch-input-variable-y: stage-y
        newswitch-input-variable-z: stage-a
        position-x: ~ inputs['stage-x'].value
        position-y: ~ inputs['stage-y'].value
        position-z: ~ inputs['stage-a'].value
  slider:
    kind: design
    design: primitives/linear-stage.dsn
    instantiation:
      inputs:
        newswitch-device-id-stage: slider
        newswitch-device-id-axis: slider/axis
        newswitch-input-variable: stage-z
        position: ~ inputs['stage-z'].value
  standalone-board:
    kind: design
    design: primitives/controllers/standalone-board.dsn
    instantiation:
      inputs:
        newswitch-device-id: standalone-board
  mapping-led:
    kind: design
    design: primitives/controller-mapping.dsn
    instantiation:
      inputs:
        newswitch-controller-id: standalone-board
        newswitch-peripheral-id: led
        newswitch-mapping-type: serial-led
  mapping-laser:
    kind: design
    design: primitives/controller-mapping.dsn
    instantiation:
      inputs:
        newswitch-controller-id: standalone-board
        newswitch-peripheral-id: laser
        newswitch-mapping-type: serial-laser
        id: 1
  mapping-axis-x:
    kind: design
    design: primitives/controller-mapping.dsn
    instantiation:
      inputs:
        newswitch-controller-id: standalone-board
        newswitch-peripheral-id: xyz-stage/x
        newswitch-mapping-type: serial-motor
        id: 1
  mapping-axis-y:
    kind: design
    design: primitives/controller-mapping.dsn
    instantiation:
      inputs:
        newswitch-controller-id: standalone-board
        newswitch-peripheral-id: xyz-stage/y
        newswitch-mapping-type: serial-motor
        id: 2
  mapping-axis-a:
    kind: design
    design: primitives/controller-mapping.dsn
    instantiation:
      inputs:
        newswitch-controller-id: standalone-board
        newswitch-peripheral-id: xyz-stage/a
        newswitch-mapping-type: serial-motor
        id: 0
  mapping-axis-z:
    kind: design
    design: primitives/controller-mapping.dsn
    instantiation:
      inputs:
        newswitch-controller-id: standalone-board
        newswitch-peripheral-id: slider/axis
        newswitch-mapping-type: serial-motor
        id: 3

assemblies:
  wiring:
    children:
      led:
        assembly: wiring
      laser:
        assembly: wiring
      xyz-stage:
        assembly: wiring
      slider:
        assembly: wiring
      standalone-board:
        assembly: wiring
        children:
          mapping-led:
            assembly: wiring
          mapping-laser:
            assembly: wiring
          mapping-axis-x:
            assembly: wiring
          mapping-axis-y:
            assembly: wiring
          mapping-axis-z:
            assembly: wiring
          mapping-axis-a:
            assembly: wiring
