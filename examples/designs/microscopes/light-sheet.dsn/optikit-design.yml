optikit-version: v0.1.0-alpha.1

design:
  description: A light-sheet microscope
  tags:
    - instrument
    - instrument/microscope

inputs:
  stage-x:
    description: Extension of the xyz stage's x-axis actuator
    kind: float64
    units: mm
    min: 0
    max: 25
    tags:
      - pose/actuator/translation
      - adjustment/electronic
  stage-y:
    description: Extension of the xyz stage's y-axis actuator
    kind: float64
    units: mm
    min: 0
    max: 25
    tags:
      - pose/actuator/translation
      - adjustment/electronic
  stage-z:
    description: Extension of the standalone linear actuator
    kind: float64
    units: mm
    min: 0
    max: 25
    tags:
      - pose/actuator/translation
      - adjustment/electronic
  stage-a:
    description: Extension of the xyz stage's z-axis actuator
    kind: float64
    units: mm
    min: 0
    max: 25
    tags:
      - pose/actuator/translation
      - adjustment/electronic

components:
  root-controller:
    kind: design
    design: primitives/controllers/root.dsn
  camera:
    kind: design
    design: primitives/hikcamera-with-objective.dsn
    instantiation:
      inputs:
        newswitch-device-id: camera
  connection-camera:
    kind: design
    design: primitives/connections/usb3-vision.dsn
    instantiation:
      inputs:
        newswitch-controller-id: root
        newswitch-peripheral-id: camera
  standalone-board:
    kind: design
    design: primitives/controllers/standalone-board.dsn
    instantiation:
      inputs:
        newswitch-device-id: standalone-board
  connection-standalone-board:
    kind: design
    design: primitives/connections/uc2-rest-serial.dsn
    instantiation:
      inputs:
        newswitch-controller-id: root
        newswitch-peripheral-id: standalone-board
        port-pattern: /dev/ttyUSB*
        baudrate: 115200
  led:
    kind: design
    design: cube-mounted/led-ring.dsn
    instantiation:
      inputs:
        newswitch-device-id-led: led
  connection-led:
    kind: design
    design: primitives/connections/direct.dsn
    instantiation:
      inputs:
        newswitch-controller-id: standalone-board
        newswitch-peripheral-id: led
  laser:
    kind: design
    design: primitives/lasers/boison-488.dsn
    instantiation:
      inputs:
        newswitch-device-id: laser
  connection-laser:
    kind: design
    design: primitives/connections/direct.dsn
    instantiation:
      inputs:
        newswitch-controller-id: standalone-board
        newswitch-peripheral-id: laser
        id: 1
  xyz-stage:
    kind: design
    design: primitives/xyz-stage.dsn
    instantiation:
      inputs:
        newswitch-device-id: xyz-stage
        newswitch-device-id-x: xyz-stage/x
        newswitch-device-id-y: xyz-stage/y
        newswitch-device-id-z: xyz-stage/a
        newswitch-input-variable-x: stage-x
        newswitch-input-variable-y: stage-y
        newswitch-input-variable-z: stage-a
        position-x: ~ inputs['stage-x'].value
        position-y: ~ inputs['stage-y'].value
        position-z: ~ inputs['stage-a'].value
  connection-axis-x:
    kind: design
    design: primitives/connections/direct.dsn
    instantiation:
      inputs:
        newswitch-controller-id: standalone-board
        newswitch-peripheral-id: xyz-stage/x
        id: 1
  connection-axis-y:
    kind: design
    design: primitives/connections/direct.dsn
    instantiation:
      inputs:
        newswitch-controller-id: standalone-board
        newswitch-peripheral-id: xyz-stage/y
        id: 2
  connection-axis-a:
    kind: design
    design: primitives/connections/direct.dsn
    instantiation:
      inputs:
        newswitch-controller-id: standalone-board
        newswitch-peripheral-id: xyz-stage/a
        id: 0
  slider:
    kind: design
    design: primitives/linear-stage.dsn
    instantiation:
      inputs:
        newswitch-device-id-stage: slider
        newswitch-device-id-axis: slider/axis
        newswitch-input-variable: stage-z
        position: ~ inputs['stage-z'].value
  connection-axis-z:
    kind: design
    design: primitives/connections/direct.dsn
    instantiation:
      inputs:
        newswitch-controller-id: standalone-board
        newswitch-peripheral-id: slider/axis
        id: 3

assemblies:
  wiring:
    children:
      root-controller:
        assembly: wiring
        children:
          connection-camera:
            assembly: wiring
          connection-standalone-board:
            assembly: wiring
      camera:
        assembly: wiring
      standalone-board:
        assembly: wiring
        children:
          connection-led:
            assembly: wiring
          connection-laser:
            assembly: wiring
          connection-axis-x:
            assembly: wiring
          connection-axis-y:
            assembly: wiring
          connection-axis-z:
            assembly: wiring
          connection-axis-a:
            assembly: wiring
      led:
        assembly: wiring
      laser:
        assembly: wiring
      xyz-stage:
        assembly: wiring
      slider:
        assembly: wiring
