newswitch_version: v1.0.2 # minimum allowed newswitch version for this config file; earlier versions of newswitch may be unable to correctly handle this file

type: controller
name: HAT+ via Serial
manufacturer: openUC2
connection:
  protocol: uc2-rest
  transport:
    type: serial
    port_pattern: /dev/ttyUSB*
    baudrate: 921600
