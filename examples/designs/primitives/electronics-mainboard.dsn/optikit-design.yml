optikit-version: v0.0.0-alpha.1

design:
  description: A microcontroller with motor drivers and ports for a laser, a CAN bus, STEMMA, limit switches, and PWMs
  tags:
    - in/kit/electronics-box

components:
  case-base:
    kind: primitive
    primitive:
      kind: static
      static-models:
        gltf: PRT - 1009 - CASMAIBRD2X2BAS - B.glb
        step: PRT - 1009 - CASMAIBRD2X2BAS - B.stp
    pose:
      rotation:
        kind: grid
    tags:
      - procurement/3d-print
      - in/kit/electronics-box
  case-lid:
    kind: primitive
    primitive:
      kind: static
      static-models:
        gltf: PRT - 1010 - CASMAIBRD2X2LID - B.glb
        step: PRT - 1010 - CASMAIBRD2X2LID - B.stp
    pose:
      rotation:
        kind: grid
    tags:
      - procurement/3d-print
      - in/kit/electronics-box
  pcb:
    kind: primitive
    primitive:
      kind: static
    tags:
      - electronics/pcb/microcontroller
      - procurement/pcba
      - in/kit/electronics-box
  stepper-motor-driver-1:
    kind: primitive
    primitive:
      static-models:
        bom: BUY - Motordriver - TMC2209.bom.yml
    tags:
      - electronics/pcb/motor-driver
      - procurement/buy
      - in/kit/electronics-box
  stepper-motor-driver-2:
    kind: primitive
    primitive:
      static-models:
        bom: BUY - Motordriver - TMC2209.bom.yml
    tags:
      - electronics/pcb/motor-driver
      - procurement/buy
      - in/kit/electronics-box
  stepper-motor-driver-3:
    kind: primitive
    primitive:
      static-models:
        bom: BUY - Motordriver - TMC2209.bom.yml
    tags:
      - electronics/pcb/motor-driver
      - procurement/buy
      - in/kit/electronics-box
  stepper-motor-driver-4:
    kind: primitive
    primitive:
      static-models:
        bom: BUY - Motordriver - TMC2209.bom.yml
    tags:
      - electronics/pcb/motor-driver
      - procurement/buy
      - in/kit/electronics-box
  screw-1:
    kind: primitive
    primitive:
      static-models:
        bom: TP lens head screw with TORX - 3 x 6 - St - A2K.bom.yml
    tags:
      - structure/fastener/threaded
      - procurement/buy
      - in/kit/electronics-box
  screw-2:
    kind: primitive
    primitive:
      static-models:
        bom: TP lens head screw with TORX - 3 x 6 - St - A2K.bom.yml
    tags:
      - structure/fastener/threaded
      - procurement/buy
      - in/kit/electronics-box
  screw-3:
    kind: primitive
    primitive:
      static-models:
        bom: TP lens head screw with TORX - 3 x 6 - St - A2K.bom.yml
    tags:
      - structure/fastener/threaded
      - procurement/buy
      - in/kit/electronics-box
  washer-1:
    kind: primitive
    primitive:
      static-models:
        bom: ISO 7089 A - Washer - 3 - A2 - 200 HV.bom.yml
    tags:
      - structure/fastener/washer
      - procurement/buy
      - in/kit/electronics-box
  washer-2:
    kind: primitive
    primitive:
      static-models:
        bom: ISO 7089 A - Washer - 3 - A2 - 200 HV.bom.yml
    tags:
      - structure/fastener/washer
      - procurement/buy
      - in/kit/electronics-box
  washer-3:
    kind: primitive
    primitive:
      static-models:
        bom: ISO 7089 A - Washer - 3 - A2 - 200 HV.bom.yml
    tags:
      - structure/fastener/washer
      - procurement/buy
      - in/kit/electronics-box
  drivers:
    kind: primitive
    primitive:
      kind: static
      static-models:
        # Warning: the following schema assumes a device type which is not yet defined in the NewSwitch device config schema!
        newswitch-device: mainboard.newswitch-device.yml
    results:
      newswitch-device-id: ~ inputs['newswitch-device-id'].value
      newswitch-device-config: >
        ~ {
          device_id: inputs['newswitch-device-id'].value
        }

inputs:
  newswitch-device-id:
    description: A short unique name for the device in NewSwitch, which can be referenced from other parts of the overall NewSwitch config
    kind: string
    tags:
      - config/newswitch/device-id
