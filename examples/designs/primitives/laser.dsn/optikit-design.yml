optikit-version: v0.1.0-alpha.1

design:
  description: A laser with fiber output
  tags:
    - composition/cube-compatible
    - in/kit/fluo-laser-box

inputs:
  newswitch-device-id:
    description: A short unique name for the device in NewSwitch, which can be referenced from other parts of the overall NewSwitch config
    kind: string
    tags:
      - config/newswitch/device-id

components:
  root:
    kind: location
  case-top:
    kind: design
    design: half-case.dsn
  case-bottom:
    kind: design
    design: half-case.dsn
  laser:
    kind: primitive
    primitive:
      kind: static
      static-models:
        gltf: BUY - Laser 488 nm - Bosion Laser.glb
        step: BUY - Laser 488 nm - Bosion Laser.stp
    tags:
      - optical/fiber
      - optical/source/laser/488-nm
      - procurement/buy
      - in/kit/fluo-laser-box
  drivers:
    kind: primitive
    primitive:
      kind: static
      static-models:
        # Warning: the contents of this file are fictional; they're only provided to simulate the shape of what NewSwitch expects as its config!
        newswitch-device: laser.newswitch-device.yml
    results:
      newswitch-device-id: ~ inputs['newswitch-device-id'].value

assemblies:
  '':
    children:
      root:
        pose:
          rotation:
            kind: grid
            grid: {z: +x, x: -y}
        children:
          case-top: {}
          case-bottom:
            pose:
              rotation:
                kind: grid
                grid: {x: -x}
          laser:
            pose:
              rotation:
                kind: grid
              translation:
                offset-mm: {z: 20}
  wiring:
    children:
      drivers: {}
