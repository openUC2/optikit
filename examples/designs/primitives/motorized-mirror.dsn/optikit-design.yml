optikit-version: v0.0.0-alpha.1

design:
  description: A motorized galvo mirror with mounting hardware

components:
  motorized-mirror:
    kind: primitive
    primitive:
      static-models:
        gltf: BUY - Galvo scanner XY --- single motor.glb
        step: BUY - Galvo scanner XY --- single motor.stp
    pose:
      rotation:
        kind: euler
        euler:
          z: -90
          y: ~ inputs['mirror-rotation'].value
      translation:
        offset-mm:
          x: -44
    tags:
      - optical/mirror/flat
      - optical/mirror/single-sided
      - actuation/rotational/stepper
      - control/electronic
      - procurement/buy
      - in/kit/galvo-box
  mount-ring:
    kind: primitive
    primitive:
      static-models:
        gltf: PRT - 2180 - DISRNG.glb
        step: PRT - 2180 - DISRNG.stp
    pose:
      rotation:
        kind: grid
        grid: {x: -x}
      translation:
        offset-mm:
          x: ~ -44 + 17
    tags:
      - structure/mount
      - procurement/3d-print
      - in/kit/galvo-box
  screw-1:
    kind: primitive
    primitive:
      static-models:
        bom: ISO 4762 - Cylinder head screw with hex socket - M3 x 20 - 8.8 - A2K.bom.yml
    tags:
      - structure/fastener/threaded
      - procurement/buy
      - in/kit/galvo-box
  screw-2:
    kind: primitive
    primitive:
      static-models:
        bom: ISO 4762 - Cylinder head screw with hex socket - M3 x 20 - 8.8 - A2K.bom.yml
    tags:
      - structure/fastener/threaded
      - procurement/buy
      - in/kit/galvo-box
  mount-top:
    kind: primitive
    primitive:
      static-models:
        gltf: PRT - 2165 - CLPPCE.glb
        step: PRT - 2165 - CLPPCE.stp
    pose:
      rotation:
        kind: grid
        grid: {x: -y}
      translation:
        offset-mm:
          x: ~ -44 + 1.7
    tags:
      - structure/mount
      - in/kit/galvo-box

inputs:
  mirror-rotation:
    description: Rotation of mirror about the rotation axis of the motor
    kind: float64
    units: deg
    tags:
      - pose/actuator/orientation
      - adjustment/actuated
      - actuation/rotational/stepper
      - control/electronic
