optikit-version: v0.0.0-alpha.1

design:
  description: An x-y-z stage
  tags:
    - composition/cube-compatible
    - in/kit/light-sheet-box

inputs:
  newswitch-device-id:
    description: A short unique name for the device in NewSwitch, which can be referenced from other parts of the overall NewSwitch config
    kind: string
    tags:
      - config/newswitch/device-id
  newswitch-device-id-x:
    description: A short unique name for the device's x-axis device in NewSwitch, which can be referenced from other parts of the overall NewSwitch config
    kind: string
    tags:
      - config/newswitch/device-id
  position-x:
    description: Extension of the sample stage's x-axis actuator
    kind: float64
    units: mm
    min: 0
    max: 25
    tags:
      - pose/actuator/translation
      - adjustment/electronic
  newswitch-input-variable-x:
    description: The name of the top-level Optikit design's input variable providing the value of the x-stage input variable
    kind: string
    tags:
      - config/newswitch/input-variable-binding
  newswitch-device-id-y:
    description: A short unique name for the device's y-axis device in NewSwitch, which can be referenced from other parts of the overall NewSwitch config
    kind: string
    tags:
      - config/newswitch/device-id
  position-y:
    description: Extension of the sample stage's y-axis actuator
    kind: float64
    units: mm
    min: 0
    max: 25
    tags:
      - pose/actuator/translation
      - adjustment/electronic
  newswitch-input-variable-y:
    description: The name of the top-level Optikit design's input variable providing the value of the y-stage input variable
    kind: string
    tags:
      - config/newswitch/input-variable-binding
  newswitch-device-id-z:
    description: A short unique name for the device's z-axis device in NewSwitch, which can be referenced from other parts of the overall NewSwitch config
    kind: string
    tags:
      - config/newswitch/device-id
  position-z:
    description: Extension of the sample stage's z-axis actuator
    kind: float64
    units: mm
    min: 0
    max: 25
    tags:
      - pose/actuator/translation
      - adjustment/electronic
  newswitch-input-variable-z:
    description: The name of the top-level Optikit design's input variable providing the value of the z-stage input variable
    kind: string
    tags:
      - config/newswitch/input-variable-binding

components:
  base:
    kind: design
    design: base.dsn
  xy-plate:
    kind: design
    design: xy-plate.dsn
  yz-plate:
    kind: design
    design: yz-plate.dsn
  z-plate:
    kind: primitive
    primitive:
      kind: static
      static-models:
        gltf: BUY - Manual Z stage - LZ40 --- slide.glb
        step: BUY - Manual Z stage - LZ40 --- slide.stp
  stage-center:
    kind: mate
    # kind: design
    # design: primitives/axes.dsn
  x-axis-driver:
    kind: primitive
    primitive:
      kind: static
      static-models:
        newswitch-device: axis.newswitch-device.yml
    results:
      newswitch-device-id: ~ inputs['newswitch-device-id-x'].value
      newswitch-device-config: >
        ~ {
          optikit_dsn_variable: inputs['newswitch-input-variable-x'].value
        }
  y-axis-driver:
    kind: primitive
    primitive:
      kind: static
      static-models:
        newswitch-device: axis.newswitch-device.yml
    results:
      newswitch-device-id: ~ inputs['newswitch-device-id-y'].value
      newswitch-device-config: >
        ~ {
          optikit_dsn_variable: inputs['newswitch-input-variable-y'].value
        }
  z-axis-driver:
    kind: primitive
    primitive:
      kind: static
      static-models:
        newswitch-device: axis.newswitch-device.yml
    results:
      newswitch-device-id: ~ inputs['newswitch-device-id-z'].value
      newswitch-device-config: >
        ~ {
          optikit_dsn_variable: inputs['newswitch-input-variable-z'].value
        }
  stage-drivers:
    kind: primitive
    primitive:
      kind: static
      static-models:
        newswitch-device: stage.newswitch-device.yml
    results:
      newswitch-device-id: ~ inputs['newswitch-device-id'].value
      newswitch-device-config: >
        ~ {
          axes: {
            x: inputs['newswitch-device-id-x'].value,
            y: inputs['newswitch-device-id-y'].value,
            z: inputs['newswitch-device-id-z'].value,
          }
        }

assemblies:
  '':
    children:
      base:
        pose:
          translation:
            offset-mm:
              z: 13.6
        children:
          xy-plate:
            pose:
              translation:
                offset-mm:
                  x: ~ inputs['position-x'].value
            children:
              yz-plate:
                pose:
                  translation:
                    offset-mm:
                      y: ~ -1 * inputs['position-y'].value
                children:
                  z-plate:
                    pose:
                      rotation:
                        kind: grid
                        grid: {z: +x, x: +y}
                      translation:
                        offset-mm:
                          x: -4
                          y: 4
                          z: ~ 30 + inputs['position-z'].value
                    children:
                      stage-center:
                        # assembly: ZposXpos
                        pose:
                          kind: relative-translation
                          translation:
                            offset-mm:
                              z: 37
  wiring:
    children:
      stage-drivers:
        children:
          x-axis-driver: {}
          y-axis-driver: {}
          z-axis-driver: {}
