optikit-version: v0.1.0-alpha.1

design:
  description: A connection from a controller to a CANopen peripheral device over a shared CAN bus
  tags:
    - config/newswitch/device-relation

inputs:
  newswitch-controller-id:
    description: The ID of the controller device in NewSwitch
    kind: string
    tags:
      - config/newswitch/device-id
  newswitch-peripheral-id:
    description: The ID of the peripheral device in NewSwitch
    kind: string
    tags:
      - config/newswitch/device-id
  protocol:
    description: The kind of connection to the peripheral device
    kind: string
    enum:
      - canopen
      - canopen-pwm
    tags:
      - config/newswitch/controller-connection-type
  id:
    description: ID of the peripheral device
    kind: int
    min: 0
    tags:
      - config/newswitch/firmware-id
  subid:
    description: Sub-ID of the peripheral device
    kind: int
    min: 0
    tags:
      - config/newswitch/firmware-subid
  pwm-max:
    description: PWM resolution for the peripheral device, if the protocol supports it
    kind: int
    min: 0

components:
  connection:
    kind: results
    results:
      newswitch-device-id: ~ inputs['newswitch-controller-id'].value
      newswitch-device-config: >
        ~ {
          connections: fromPairs([
            [inputs['newswitch-peripheral-id'].value, {
              protocol: inputs['protocol'].value,
              selectors: {
                id: inputs['id'].value,
                subid: inputs['subid'].value,
              },
              pwm_max: inputs['protocol'].value == 'canopen-pwm' ? inputs['pwm-max'].value : nil,
            }],
          ]),
        }

assemblies:
  wiring:
    children:
      connection: {}
