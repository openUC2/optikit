optikit-version: v0.0.0-alpha.1

design:
  description: A camera attached to a 100 mm lens in a cube-shaped housing
  tags:
    - composition/cube-compatible
    - in/core-box

components:
  lens-and-camera:
    kind: primitive
    primitive:
      kind: static
      static-models:
        gltf: ASS - 4003 - CAM+OBJ.glb
        step: ASS - 4003 - CAM+OBJ.stp
    pose:
      rotation:
        kind: grid
    tags:
      - optical/lens/convex
      - optical/detector/camera
      - procurement/buy
      - procurement/3d-print
      - in/kit/infinity-box
  drivers:
    kind: primitive
    primitive:
      kind: static
      static-models:
        newswitch-device: hikcamera.newswitch-device.yml
    results:
      newswitch-device-id: inputs['newswitch-device-id'].value

inputs:
  newswitch-device-id:
    description: A short unique name for the device in NewSwitch, which can be referenced from other parts of the overall NewSwitch config
    kind: string
    tags:
      - config/newswitch/device-id
