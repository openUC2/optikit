optikit-version: v0.0.0-alpha.1

design:
  description: A camera attached to a 100 mm lens in a cube-shaped housing
  tags:
    - composition/cube-compatible
    - in/core-box

components:
  lens:
    kind: primitive
    primitive:
      kind: static
      static-models:
        gltf: BUY - Objectiv - CLENS-100TEL.glb
        step: BUY - Objectiv - CLENS-100TEL.stp
    pose:
      rotation:
        kind: grid
      translation:
        offset-mm: {x: 23.9}
    tags:
      - optical/lens/convex
      - procurement/buy
      - in/kit/infinity-box
  camera:
    kind: primitive
    primitive:
      kind: static
      static-models:
        gltf: BUY - HIKROBOT - Camera - MV-CE060-10UM-PRO.glb
        step: BUY - HIKROBOT - Camera - MV-CE060-10UM-PRO.stp
    pose:
      rotation:
        kind: grid
        grid: {z: -x, x: -z}
      translation:
        offset-mm: {x: -52.2}
    tags:
      - optical/detector/camera
      - procurement/buy
      - in/kit/infinity-box
  lens-holder-bottom:
    kind: design
    design: half-case.dsn
    pose:
      rotation:
        kind: grid
  drivers:
    kind: primitive
    primitive:
      kind: static
      static-models:
        newswitch-device: hikcamera.newswitch-device.yml
    results:
      newswitch-device-id: ~ inputs['newswitch-device-id'].value

inputs:
  newswitch-device-id:
    description: A short unique name for the device in NewSwitch, which can be referenced from other parts of the overall NewSwitch config
    kind: string
    tags:
      - config/newswitch/device-id
