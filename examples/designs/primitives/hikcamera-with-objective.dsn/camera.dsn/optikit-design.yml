optikit-version: v0.0.0-alpha.1

design:
  description: A Hikrobotics camera
  tags:
    - composition/cube-compatible
    - in/kit/infinity-box

components:
  camera:
    kind: primitive
    primitive:
      kind: static
      static-models:
        gltf: BUY - HIKROBOT - Camera - MV-CE060-10UM-PRO.glb
        step: BUY - HIKROBOT - Camera - MV-CE060-10UM-PRO.stp
    pose:
      rotation:
        kind: grid
        grid: {z: -z}
    tags:
      - optical/detector/camera
      - procurement/buy
      - in/kit/infinity-box
  drivers:
    kind: primitive
    primitive:
      kind: static
      static-models:
        # Warning: this file is actcually for the MV-CA023-001 camera! It's only included as a realistic placeholder example.
        newswitch-device: hikcamera.newswitch-device.yml
    results:
      newswitch-device-id: ~ inputs['newswitch-device-id'].value
      newswitch-device-config: >
        ~ {
          device_id: inputs['newswitch-device-id'].value
        }

inputs:
  newswitch-device-id:
    description: A short unique name for the device in NewSwitch, which can be referenced from other parts of the overall NewSwitch config
    kind: string
    tags:
      - config/newswitch/device-id
