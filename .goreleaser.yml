release:
  prerelease: auto
  # footer: |
  #   {{ if and .Tag .PreviousTag -}}
  #     **Commit history**: [{{ .PreviousTag }}...{{ .Tag }}]({{ .GitURL }}/compare/{{ .Tag }}...{{ .PreviousTag }})
  #   {{- else if .PreviousTag -}}
  #     **Commit history**: [{{ .PreviousTag }}...{{ .ShortCommit }}]({{ .GitURL }}/compare/{{ .Commit }}...{{ .PreviousTag }})
  #   {{- end }}

dockers:
  # optikit
  - id: optikit-amd64
    ids:
      - optikit
    dockerfile: "Dockerfile"
    use: buildx
    image_templates:
    - "ghcr.io/openuc2/optikit:latest-amd64"
    - "ghcr.io/openuc2/optikit:{{ .Version }}-amd64"
    build_flag_templates:
    - "--pull"
    - "--platform=linux/amd64"
    - "--label=org.opencontainers.image.created={{.Date}}"
    - "--label=org.opencontainers.image.name={{.ProjectName}}"
    - "--label=org.opencontainers.image.revision={{.FullCommit}}"
    - "--label=org.opencontainers.image.version={{.Version}}"
    - "--label=org.opencontainers.image.source={{.GitURL}}"
    - "--label=org.opencontainers.image.licenses=(Apache-2.0 OR BlueOak-1.0.0)"
  - id: optikit-arm64v8
    ids:
      - optikit
    dockerfile: "Dockerfile"
    use: buildx
    goarch: arm64
    image_templates:
    - "ghcr.io/openuc2/optikit:latest-arm64v8"
    - "ghcr.io/openuc2/optikit:{{ .Version }}-arm64v8"
    build_flag_templates:
    - "--pull"
    - "--platform=linux/arm64/v8"
    - "--label=org.opencontainers.image.created={{.Date}}"
    - "--label=org.opencontainers.image.name={{.ProjectName}}"
    - "--label=org.opencontainers.image.revision={{.FullCommit}}"
    - "--label=org.opencontainers.image.version={{.Version}}"
    - "--label=org.opencontainers.image.source={{.GitURL}}"
    - "--label=org.opencontainers.image.licenses=(Apache-2.0 OR BlueOak-1.0.0)"

docker_manifests:
  # optikit
  - name_template: "ghcr.io/openuc2/optikit:latest"
    image_templates:
      - "ghcr.io/openuc2/optikit:latest-amd64"
      - "ghcr.io/openuc2/optikit:latest-arm64v8"
  - name_template: "ghcr.io/openuc2/optikit:{{ .Major }}.{{ .Minor }}.{{ .Patch }}"
    image_templates:
      - "ghcr.io/openuc2/optikit:{{ .Version }}-amd64"
      - "ghcr.io/openuc2/optikit:{{ .Version }}-arm64v8"
