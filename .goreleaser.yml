version: 2

# The Go modules proxy's checksum service seems to choke on this repo - maybe this repo is
# too big?
# gomod:
#   proxy: true

before:
  hooks:
    - go mod download

builds:
- id: optikit
  main: .
  binary: optikit
  mod_timestamp: "{{ .CommitTimestamp }}"
  flags:
    - -trimpath
  ldflags:
    - -w
    - -X main.buildSummary={{ .Summary }}
    - -X main.buildVersion={{ .Version }}
    - -X main.buildCommitFull={{ .FullCommit }}
    - -X main.buildCommitShort={{ .ShortCommit }}
    - -X main.buildCommitDate={{ .CommitDate }}
    - -X main.buildCommitTimestamp={{ .CommitTimestamp }}
    - -X main.buildReleaseURL={{ .ReleaseURL }}
    - -X main.buildRepo={{ .GitURL }}
    - -X main.buildSystem=goreleaser
  env:
    - CGO_ENABLED=0
  targets:
    - linux_amd64_v1
    - linux_arm64
    - darwin_amd64_v1
    - darwin_arm64
  overrides:
    - goos: darwin
      goarch: amd64
      goamd64: v1
      flags:
        - -trimpath
        - -buildmode=pie
    - goos: darwin
      goarch: arm64
      flags:
        - -trimpath
        - -buildmode=pie

archives:
  - id: optikit
    ids: ["optikit"]
    name_template: "optikit_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
    - goos: windows
      formats:
        - zip

